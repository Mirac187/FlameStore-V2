name: FlameStore Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository'yi indir
        uses: actions/checkout@v4

      - name: ☕ Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🟢 Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 NPM bağımlılıklarını kur
        run: npm install

      - name: ⚡ Capacitor Android paketlerini kur
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 🏗️ Web uygulamasını build et
        run: npm run build

      - name: 🤖 Android projesini oluştur
        run: npx cap add android

      - name: 🔄 Capacitor sync
        run: npx cap sync android

      - name: 🔐 Gradle çalıştırılabilir yap
        run: chmod +x android/gradlew

      - name: 🔥 APK oluştur
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 📱 APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: FlameStore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
