name: FlameStore APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Java Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Node.js Kur
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: Otomatik Yol Düzelt ve Derle
      run: |
        # index.html içindeki bozuk yolları otomatik onaralım
        if [ -f "index.html" ]; then
          sed -i 's|="/src/|="./|g' index.html || true
          sed -i 's|src="/src/|src="./|g' index.html || true
          sed -i 's|src="src/|src="./|g' index.html || true
        fi
        
        if [ -f "vite.config.js" ]; then
          sed -i "s/export default defineConfig({/export default defineConfig({ base: '.\/',/g" vite.config.js || true
        fi

        npm run build

    - name: Capacitor Android Ekle
      run: |
        npx cap add android || true
        npx cap sync android

    - name: APK Derle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: APK Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: FlameStore-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
