name: FlameStore APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Java Kur (Java 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Node.js Kur
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Bağımlılıkları Yükle ve Capacitor 5 Ekle
      run: |
        npm install
        npm install @capacitor/android@5 --save

    - name: Otomatik Dosya Düzenle ve Derle
      run: |
        # Klasör yapısını oluşturalım
        mkdir -p src/pages src/services
        
        # .vue dosyalarını pages klasörüne taşıyalım
        mv Home.vue src/pages/ 2>/dev/null || true
        mv Apps.vue src/pages/ 2>/dev/null || true
        mv Chat.vue src/pages/ 2>/dev/null || true
        mv Clans.vue src/pages/ 2>/dev/null || true
        mv Community.vue src/pages/ 2>/dev/null || true
        mv Developer.vue src/pages/ 2>/dev/null || true
        mv Inbox.vue src/pages/ 2>/dev/null || true
        mv Moderation.vue src/pages/ 2>/dev/null || true
        mv Profile.vue src/pages/ 2>/dev/null || true
        mv Publish.vue src/pages/ 2>/dev/null || true
        mv Rules.vue src/pages/ 2>/dev/null || true
        mv Settings.vue src/pages/ 2>/dev/null || true
        mv Storage.vue src/pages/ 2>/dev/null || true
        
        # data.js dosyasını services klasörüne taşıyalım
        mv data.js src/services/ 2>/dev/null || true
        
        # Diğer ana dosyaları src içine taşıyalım
        mv App.vue src/ 2>/dev/null || true
        mv main.js src/ 2>/dev/null || true
        mv router.js src/ 2>/dev/null || true
        mv index.js src/ 2>/dev/null || true
        mv firebase.js src/ 2>/dev/null || true
        mv style.css src/ 2>/dev/null || true
        touch src/style.css
        
        # Vite config içine güvenli bir şekilde base: './' ekleyelim (Siyah ekranı önler)
        if [ -f "vite.config.js" ]; then
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('vite.config.js', 'utf8');
            if (!content.includes('base:')) {
              content = content.replace('defineConfig({', \"defineConfig({ base: './',\");
              fs.writeFileSync('vite.config.js', content);
            }
          " || true
        fi

        npm run build

    - name: Capacitor Android Ekle ve Simgeyi Enjekte Et
      run: |
        npx cap add android || true
        npx cap sync android
        
        # Eğer deponda icon.png varsa Android res klasörlerine otomatik kopyalayalım
        if [ -f "icon.png" ]; then
          cp icon.png android/app/src/main/res/drawable/ic_launcher.png || true
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
        elif [ -f "logo.png" ]; then
          cp logo.png android/app/src/main/res/drawable/ic_launcher.png || true
          cp logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
        fi

    - name: APK Derle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: APK Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: FlameStore-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
