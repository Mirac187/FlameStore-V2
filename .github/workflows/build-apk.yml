name: FlameStore APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Java Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Node.js Kur
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: Otomatik Dosya Düzenle ve Derle
      run: |
        # 1. src klasörü yoksa oluştur
        mkdir -p src
        
        # 2. Dağınık duran tüm .vue ve js dosyalarını otomatik olarak src içine taşı
        mv *.vue src/ 2>/dev/null || true
        mv main.js src/ 2>/dev/null || true
        mv router.js src/ 2>/dev/null || true
        mv data.js src/ 2>/dev/null || true
        mv index.js src/ 2>/dev/null || true
        
        # 3. index.html içindeki script yolunu /src/main.js yap
        if [ -f "index.html" ]; then
          sed -i 's|src=".*main.js"|src="/src/main.js"|g' index.html || true
          sed -i 's|src=\x27.*main.js\x27|src="/src/main.js"|g' index.html || true
        fi
        
        # 4. Vite base ayarını ekle
        if [ -f "vite.config.js" ]; then
          sed -i "s/export default defineConfig({/export default defineConfig({ base: '.\/',/g" vite.config.js || true
        fi

        # 5. Projeyi derle
        npm run build

    - name: Capacitor Android Ekle
      run: |
        npx cap add android || true
        npx cap sync android

    - name: APK Derle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: APK Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: FlameStore-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
