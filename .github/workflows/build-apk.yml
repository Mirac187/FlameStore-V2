name: Vue Capacitor APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Java Kur (Android Gradle için zorunlu)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Node.js Kur
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: Vue Projesini Derle (Vite)
      run: npm run build

    - name: Capacitor Android Senkronize Et
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Android APK Oluştur (Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: APK Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: FlameStore-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
